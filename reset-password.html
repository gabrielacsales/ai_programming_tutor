<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redefinir senha | IA Tutor</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="supabase-config.js"></script><script src="auth-client.js"></script>
<style>body{font:16px system-ui;background:#f6f9fc;color:#101828}main{background:#fff;max-width:430px;margin:12vh auto;padding:35px;border-radius:18px;border:1px solid #ddd}input,button{width:100%;padding:13px;margin:10px 0;border-radius:9px;box-sizing:border-box}input{border:1px solid #bbb}button{background:#1cb0f6;color:white;border:0;cursor:pointer}</style></head>
<body><main><h1>Nova senha</h1><p>Abra esta página pelo link de recuperação recebido no seu e-mail.</p>
<form id="form"><label>Nova senha<input id="password" type="password" minlength="6" autocomplete="new-password" required></label><button type="submit">Atualizar senha</button></form>
<p id="message" role="status"></p><a href="login.html">Voltar ao login</a></main>
<script>document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const c=window.TutorAuth?.client;const m=document.getElementById("message");if(!c){m.textContent="Supabase não configurado.";return;}const r=await c.auth.updateUser({password:document.getElementById("password").value});m.textContent=r.error?r.error.message:"Senha atualizada. Você pode entrar agora.";});</script></body></html>
